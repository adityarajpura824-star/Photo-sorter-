<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2412f">
<title>Photo Sorter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23c2412f'/%3E%3Crect x='6' y='6' width='12' height='12' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <span class="logo"><span data-icon="images"></span>Photo Sorter</span>
  <span class="pill" id="pill"><span class="dot"></span><span id="pilltext"></span></span>
  <span class="spacer"></span>
  <button class="icon-btn" id="theme" aria-label="Switch to dark mode"></button>
</header>
<main id="app"></main>
<div id="sphere" aria-hidden="true"></div>
<div id="fly" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="overlay"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="picker" multiple accept="image/*,video/*" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
