name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - run: npm ci
      - run: npm test            # the sorting / duplicate logic must pass before an APK is built
      - run: npm run vendor      # on-device model runtime -> www/vendor
      - run: npx cap sync android
      - name: Build debug APK
        shell: bash
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log
      - name: Show the Gradle error (so it is readable without the full log)
        if: failure()
        run: |
          msg=$(grep -E "error:|What went wrong|Execution failed|FAILURE" -A3 gradle.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android build failed::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: photo-sorter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
